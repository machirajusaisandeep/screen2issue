name: Verify

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  web-and-python:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install web deps
        run: npm ci

      - name: Install python deps
        run: |
          python3 -m venv python-engine/.venv
          source python-engine/.venv/bin/activate
          pip install -r python-engine/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build:web

      - name: Compile python engine
        run: python3 -m compileall python-engine/main.py python-engine/services python-engine/packaging
